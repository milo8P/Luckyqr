<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#1d6b4a;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;overflow:hidden}
.card{text-align:center;color:#fff}
.emoji{font-size:80px;margin-bottom:20px;line-height:1}
.title{font-size:72px;font-weight:700;letter-spacing:-2px;margin-bottom:12px}
.title span{color:#a3d9b8}
.sub{font-size:28px;font-weight:300;opacity:.85;margin-bottom:32px}
.badges{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:100px;padding:8px 20px;font-size:18px;font-weight:500}
.url{margin-top:32px;font-size:22px;opacity:.6;letter-spacing:1px}
</style>
</head>
<body>
<div class="card">
  <div class="emoji">🍀</div>
  <div class="title">Lucky <span>QR</span></div>
  <div class="sub">Free QR Code Generator</div>
  <div class="badges">
    <div class="badge">✓ No watermarks</div>
    <div class="badge">✓ Works offline</div>
    <div class="badge">✓ 100% Private</div>
    <div class="badge">✓ 15 QR types</div>
  </div>
  <div class="url">lucky-qr.com</div>
</div>
</body>
</html>
